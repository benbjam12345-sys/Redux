name: Build REDUX APK

on:
  push:
    paths:
      - 'REDUX-Android-source.zip'
      - '.github/workflows/build-redux.yml'
      - 'hotfix/**'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK platform and build tools
        run: |
          set +o pipefail
          yes | sdkmanager --licenses
          set -o pipefail
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Android source
        run: unzip -q REDUX-Android-source.zip

      - name: Apply unified REDUX UI fix
        run: cp hotfix/MainActivity.java REDUX-Android/app/src/main/java/com/redux/app/MainActivity.java

      - name: Verify project files
        run: |
          test -f REDUX-Android/settings.gradle
          test -f REDUX-Android/app/build.gradle
          test -f REDUX-Android/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        id: build_apk
        working-directory: REDUX-Android
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/redux-gradle-build.log"

      - name: Name APK for download
        if: success()
        run: cp REDUX-Android/app/build/outputs/apk/debug/app-debug.apk REDUX-debug.apk

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: REDUX-debug-apk
          path: REDUX-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish downloadable test APK
        if: success() && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: redux-debug-build
          name: REDUX Debug APK
          body: |
            Automated debug build of REDUX for testing on Android / Meta Quest 3S.
            This is a debug APK, not a signed production release. Gameplay mod features remain a catalog until a compatible game-side bridge is provided and verified.
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: REDUX-debug.apk

      - name: Upload build log if a previous step failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: REDUX-build-log
          path: redux-gradle-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Record build result for verification
        if: always() && github.ref == 'refs/heads/main'
        env:
          BUILD_STEP_RESULT: ${{ steps.build_apk.outcome || 'not-run' }}
          JOB_RESULT: ${{ job.status }}
          BUILD_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p .build
          {
            echo "apk_build_result=$BUILD_STEP_RESULT"
            echo "workflow_result=$JOB_RESULT"
            echo "source_commit=$BUILD_SHA"
            echo "run_url=$RUN_URL"
            echo "checked_at_utc=$(date -u +%FT%TZ)"
          } > .build/latest-build-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .build/latest-build-status.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record REDUX cloud build result"
            git push
          fi
