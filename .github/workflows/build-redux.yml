name: Build REDUX APK

on:
  push:
    paths:
      - 'REDUX-Android-source.zip'
      - '.github/workflows/build-redux.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform and build tools
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Android source
        run: unzip -q REDUX-Android-source.zip

      - name: Verify project files
        run: |
          test -f REDUX-Android/settings.gradle
          test -f REDUX-Android/app/build.gradle
          test -f REDUX-Android/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        working-directory: REDUX-Android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: REDUX-debug-apk
          path: REDUX-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
